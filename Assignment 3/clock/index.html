<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analog Clock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/clock.css">

    <!-- Script -->
    <script src="js/clock.js" defer></script>
</head>
<body class="bg-light">


    <header class="py-4 text-center">
        <div class="container">
            <h2 class="fw-bold mb-2">State-Sync Analog Clock</h2>
            <p class="text-muted mb-0">Real-time HTML5 Canvas clock with Day and Night mode</p>
        </div>
    </header>

    <main class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <button id="modeToggle" class="btn btn-primary mb-4">
                            Switch to Night Mode
                        </button>

                        <div class="clock-wrapper mx-auto">
                            <canvas id="clockCanvas" width="400" height="400"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
