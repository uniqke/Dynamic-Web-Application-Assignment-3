<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NYTimes News Stream</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Optional shared styles -->
    <link rel="stylesheet" href="nytimes.css">

    <script src="nytimes.js" type="module" defer></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Newsly Dashboard</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="map.html">MapQuest</a></li>
                    <li class="nav-item"><a class="nav-link active" href="nytimes.html">NYTimes API</a></li>
                    <li class="nav-item"><a class="nav-link" href="youtube.html">YouTube API</a></li>
                    <li class="nav-item"><a class="nav-link" href="clock.html">Analog Clock</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="py-4 text-center">
        <div class="container">
            <h2 class="fw-bold mb-2">Real-Time News Stream</h2>
            <p class="text-muted mb-0">Search New York Times articles by keyword</p>
        </div>
    </header>

    <main class="container pb-5">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-9">
                        <input
                            type="text"
                            id="searchInput"
                            class="form-control form-control-lg"
                            placeholder="Search news topics e.g. climate change"
                        >
                    </div>
                    <div class="col-md-3 d-grid">
                        <button id="searchBtn" class="btn btn-primary btn-lg">Search News</button>
                    </div>
                </div>

                <div class="mt-3">
                    <small id="statusMessage" class="text-muted"></small>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center my-4 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading articles...</p>
        </div>

        <!-- Results -->
        <div id="newsResults" class="row g-4"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
