<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>GeoPulse Dashboard</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- MapQuest -->
<link type="text/css" rel="stylesheet" href="https://api.mqcdn.com/sdk/mapquest-js/v1.3.2/mapquest.css"/>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <div class="container py-4">

  
    <div class="text-center mb-4">
      <h1 class="fw-bold">GeoPulse Dashboard</h1>
      <p class="text-muted">Search any location and explore it on the map</p>
    </div>

  
    <div class="card shadow-sm mb-4">
      <div class="card-body">

        <div class="row g-2">
          <div class="col-md-9">
            <input
              type="text"
              id="locationInput"
              class="form-control form-control-lg"
              placeholder="Enter a location e.g. Santa Cruz Jamaica W.I "
            />
          </div>

          <div class="col-md-3 d-grid">
            <button id="searchBtn" class="btn btn-primary btn-lg">
              Search Location
            </button>
          </div>
        </div>

        <div class="mt-3">
          <small id="status" class="text-muted"></small>
        </div>

      </div>
    </div>


    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div id="map"></div>
      </div>
    </div>

  </div>

  <!-- MapQuest -->
<script src="https://api.mqcdn.com/sdk/mapquest-js/v1.3.2/mapquest.js"></script>

  <!-- App -->
  <script type="module" src="app.js"></script>

</body>
</html>
