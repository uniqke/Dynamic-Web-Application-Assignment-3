<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Media Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">

    <script src="app.js" type="module" defer></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">GeoPulse Dashboard</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="map.html">MapQuest</a></li>
                    <li class="nav-item"><a class="nav-link" href="nytimes.html">NYTimes API</a></li>
                    <li class="nav-item"><a class="nav-link active" href="youtube.html">YouTube API</a></li>
                    <li class="nav-item"><a class="nav-link" href="clock.html">Analog Clock</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="py-4 text-center">
        <div class="container">
            <h2 class="fw-bold mb-2">On-Demand Media Player</h2>
            <p class="text-muted mb-0">Search YouTube videos and play them instantly</p>
        </div>
    </header>

    <main class="container pb-5">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-9">
                        <input
                            type="text"
                            id="videoSearchInput"
                            class="form-control form-control-lg"
                            placeholder="Search videos e.g. Jamaica travel"
                        >
                    </div>
                    <div class="col-md-3 d-grid">
                        <button id="videoSearchBtn" class="btn btn-danger btn-lg">Search Videos</button>
                    </div>
                </div>

                <div class="mt-3">
                    <small id="videoStatus" class="text-muted"></small>
                </div>
            </div>
        </div>

               <div class="card shadow-sm border-0 mb-4">
          <div class="card-body">
            <div class="ratio ratio-16x9">
              <iframe
                id="videoPlayer"
                src=""
                title="YouTube video player"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
              </iframe>
            </div>

            <div id="playerFallback" class="alert alert-warning mt-3 d-none mb-0">
              This video may not allow embedded playback.
              <a id="watchOnYouTube" href="#" target="_blank" class="alert-link">Watch on YouTube</a>
            </div>
          </div>
        </div>

        <div id="videoResults" class="row g-4"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
